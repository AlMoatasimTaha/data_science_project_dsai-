[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-market-lab"
version = "1.0.0"
description = "Audited multi-task ML laboratory for Kaggle AI job market data"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--basetemp=data/interim/pytest_tmp"

[project.scripts]
job-market = "jobmarket.cli:main"
